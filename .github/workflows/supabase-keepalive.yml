name: Supabase keep-alive

# Supabase Free pauses a project after ~7 days with no requests. This job pings
# the REST API every day so the project never stays idle long enough to pause.
# Even with RLS returning no rows for the anon key, the request still counts as
# activity, which is all we need.

on:
  schedule:
    - cron: '0 6 * * *' # every day at 06:00 UTC (well under the 7-day window)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/reservations?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Supabase pinged OK ($(date -u))"
